name = "ngano"
main = "src/index.ts"
account_id = "67cb2eb6080019612e374af596f7197c"
compatibility_date = "2025-09-01"
workers_dev = true

# ngano.dev is served entirely from generated responses: the site HTML, the JSON API,
# the MCP endpoint and the raw data downloads are all built from data/*.json at module
# scope, so there is no [assets] binding and no static upload step.

[[routes]]
pattern = "ngano.dev"
custom_domain = true

[[routes]]
pattern = "www.ngano.dev"
custom_domain = true

# Per-country request counts, written by the Worker itself. Free tier on Workers, no
# client-side beacon, and it sees the API and the MCP endpoint too, which a page script
# never could. See src/analytics.ts for what is and is not recorded.
# Admin credentials and sessions. The password lives here, not in a secret, so it can
# be changed from the dashboard without a redeploy.
[[kv_namespaces]]
binding = "ADMIN"
id = "6472bcd1857a459aa1281fcbc070297f"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ngano_requests"

# The contact form. Cloudflare Email Routing delivers to a verified destination; the
# envelope sender has to be an address on this zone even though nothing receives there.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "inmisimail@gmail.com"

[vars]
VERSION = "0.1.0"
CONTACT_TO = "inmisimail@gmail.com"
CONTACT_FROM = "contact@ngano.dev"
BASE_URL = "https://ngano.dev"

[observability]
enabled = true
