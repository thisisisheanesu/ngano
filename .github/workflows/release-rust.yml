name: Release Rust

# Triggered by a tag of the form rs-v0.1.0.
#
#   git tag rs-v0.1.0 && git push origin rs-v0.1.0
#
# ---------------------------------------------------------------------------
# One-time repository settings the author must configure
# ---------------------------------------------------------------------------
# 1. crates.io: log in with GitHub at https://crates.io/settings/tokens and
#    create an API token. Scope it to publish-update, and to the crate `ngano`
#    once the first version exists. The very first publish needs a token that
#    can create a new crate.
# 2. GitHub: Settings -> Secrets and variables -> Actions -> New repository
#    secret, named CARGO_REGISTRY_TOKEN, holding that token.
# 3. GitHub: Settings -> Environments -> New environment, named exactly
#    `crates-io`. Scope CARGO_REGISTRY_TOKEN to that environment, add yourself
#    as a required reviewer, and restrict it to tags matching rs-v*.
# 4. packages/rust/Cargo.toml must carry description, license, repository,
#    readme, keywords and categories, or crates.io rejects the upload.
# 5. crates.io publishes are permanent. A version can be yanked but never
#    replaced, so the dry run step below is not optional.
# ---------------------------------------------------------------------------

on:
  push:
    tags: ['rs-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate the catalogue before shipping it
        working-directory: .
        run: |
          python -m pip install --upgrade jsonschema
          python scripts/validate_catalogue.py

      - name: Confirm the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#rs-v}"
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag crate=$version"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/')

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Package dry run
        run: cargo publish --dry-run

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/ngano
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust

      - name: Publish
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
